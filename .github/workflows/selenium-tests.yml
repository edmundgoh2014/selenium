name: Java Selenium CI

# Trigger the workflow on push or pull request to the main branch
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    # Use the latest Ubuntu runner (it comes with Chrome pre-installed!)
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the repository code
    - name: Checkout code
      uses: actions/checkout@v5

    # 2. Set up Java Environment
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17' # Change to '11' or '21' depending on your project
        distribution: 'temurin'
        cache: maven # Caches dependencies to make future runs faster

    # 3. Run Selenium Tests
    - name: Run Tests with Maven
      run: mvn test